name: Sync Notion → GitHub Issues

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: notion-reverse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSL certificates
        run: |
          python3 -m pip install --quiet --break-system-packages certifi
          echo "SSL_CERT_FILE=$(python3 -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Close GitHub issues for completed Notion tasks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          import sys; sys.path.insert(0, "scripts")
          from notion_helpers import notion_query_all

          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]


          def gh_request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload else None
              headers = {
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  print(f"GitHub {method} {path} failed HTTP {exc.code}: {raw[:500]}")
                  raise


          # Query Notion for all pages with Task Status = Done
          pages = notion_query_all(filter_obj={
              "property": "Task Status", "status": {"equals": "Done"}
          })

          closed = 0
          skipped = 0
          errors = 0

          for page in pages:
              page_id = page["id"]
              try:
                  props = page.get("properties", {})
                  rt = props.get("GitHub", {}).get("rich_text", [])
                  gh_text = rt[0].get("plain_text", "") if rt else ""

                  if not gh_text:
                      print(f"Page {page_id} has no GitHub ref — skipping.")
                      skipped += 1
                      continue

                  # Handle #N format (single or comma-separated): "#43, #44, #26"
                  issue_nums = re.findall(r"#(\d+)", gh_text)
                  if not issue_nums:
                      print(f"No issue numbers in '{gh_text}' — skipping.")
                      skipped += 1
                      continue

                  for issue_num in issue_nums:
                      # Check if already closed
                      issue = gh_request("GET", f"/issues/{issue_num}")
                      if issue.get("state") == "closed":
                          skipped += 1
                          continue

                      print(f"Notion page {page_id} is Done → closing GitHub issue #{issue_num}")

                      gh_request("POST", f"/issues/{issue_num}/comments", {
                          "body": (
                              f"✅ Closed automatically — corresponding Notion page `{page_id}` "
                              "was marked Done. Synced by `sync-notion-to-github.yml`."
                          )
                      })
                      gh_request("PATCH", f"/issues/{issue_num}", {"state": "closed"})
                      print(f"  ✅ GitHub issue #{issue_num} closed")
                      closed += 1
                      time.sleep(0.5)  # GitHub rate limit: 5000 req/hour
              except Exception as e:
                  print(f"  ❌ Error processing page {page_id}: {e}")
                  errors += 1

          print(f"\nSummary: closed={closed} skipped={skipped} errors={errors}")
          PY
