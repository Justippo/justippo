name: Sync GitHub Issues → Notion

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to sync to Notion"
        required: true
        type: string

concurrency:
  group: github-to-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSL certificates
        run: |
          python3 -m pip install --quiet --break-system-packages certifi
          echo "SSL_CERT_FILE=$(python3 -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Sync GitHub issue to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action || 'workflow_dispatch' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          sys.path.insert(0, "scripts")
          from notion_helpers import notion_request, find_page_by_issue_number

          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          EVENT_ACTION = os.environ["EVENT_ACTION"]
          ISSUE_NUMBER = os.environ["ISSUE_NUMBER"]
          NOTION_DATABASE_ID = os.environ.get("NOTION_DATABASE_ID", "38cbf1cf330681b484d0c68d7fc9505c")


          def gh_request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload else None
              headers = {
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  print(f"GitHub {method} {path} failed HTTP {exc.code}: {raw[:500]}")
                  raise


          def update_notion_page(page_id, completed, task_status, title=None, labels=None, assignees=None):
              """Update ALL properties on a Notion page (not just status).

              This fixes the bug where edited issues only synced status but not
              title, priority, tags, or assignees — leaving columns unfilled.
              """
              labels = labels or []
              assignees = assignees or []
              priority = _priority_from_labels(labels)

              props = {
                  "Task Status": {"status": {"name": task_status}},
                  "Completed": {"checkbox": completed},
                  "Priority": {"select": {"name": priority}},
                  "Tags": {"multi_select": [{"name": l} for l in labels[:10] if l]},
              }
              if title:
                  props["Name"] = {"title": [{"text": {"content": title}}]}
              if assignees:
                  props["Assignees"] = {"multi_select": [{"name": a} for a in assignees[:10]]}
              notion_request("PATCH", f"/pages/{page_id}", {"properties": props})


          def _priority_from_labels(labels):
              label_set = {l.lower() for l in labels}
              if "priority: critical" in label_set or "p0" in label_set:
                  return "Critical"
              if "priority: high" in label_set or "p1" in label_set:
                  return "High"
              if "priority: medium" in label_set or "p2" in label_set:
                  return "Medium"
              if "priority: low" in label_set or "p3" in label_set:
                  return "Low"
              return "Medium"


          def create_notion_page(issue_number, title, completed, task_status, labels=None, assignees=None):
              """Create a new Notion page for a GitHub issue."""
              labels = labels or []
              assignees = assignees or []
              is_closed = completed

              # Derive priority from labels
              priority = "Medium"
              label_set = {l.lower() for l in labels}
              if "priority: critical" in label_set or "p0" in label_set:
                  priority = "Critical"
              elif "priority: high" in label_set or "p1" in label_set:
                  priority = "High"
              elif "priority: medium" in label_set or "p2" in label_set:
                  priority = "Medium"
              elif "priority: low" in label_set or "p3" in label_set:
                  priority = "Low"

              props = {
                  "Name": {"title": [{"text": {"content": title}}]},
                  "GitHub": {"rich_text": [{"text": {"content": f"#{issue_number}"}}]},
                  "Task Status": {"status": {"name": task_status}},
                  "Completed": {"checkbox": completed},
                  "Priority": {"select": {"name": priority}},
                  "Tags": {"multi_select": [{"name": label} for label in labels[:10] if label]},
              }
              if assignees:
                  props["Assignees"] = {"multi_select": [{"name": a} for a in assignees[:10]]}
              # Evidence-based contribution column (filled later by
              # scripts/populate_notion_contributors.py or manually).
              props["Actual Contributors"] = {"rich_text": []}

              _, created = notion_request("POST", "/pages", {
                  "parent": {"database_id": NOTION_DATABASE_ID},
                  "properties": props,
              })
              return created


          # Fetch GitHub issue
          issue = gh_request("GET", f"/issues/{ISSUE_NUMBER}")
          issue_title = issue.get("title", "Untitled")
          issue_state = issue.get("state", "unknown")
          issue_labels = [l.get("name", "") for l in issue.get("labels", [])]
          issue_assignees = [a.get("login", "") for a in issue.get("assignees", [])]

          # Map state to Notion Task Status and Completed checkbox
          completed = issue_state == "closed"
          task_status = "Done" if completed else "To Do"

          # For label/unlabel events, update all properties on existing pages
          if EVENT_ACTION in ("labeled", "unlabeled"):
              page_id = find_page_by_issue_number(ISSUE_NUMBER)
              if not page_id:
                  print(f"Label event: no Notion page for issue #{ISSUE_NUMBER}; skipping.")
                  exit(0)
              print(f"Label event: updating page {page_id}.")
              update_notion_page(page_id, completed, task_status, title=issue_title, labels=issue_labels, assignees=issue_assignees)
              exit(0)

          # For closed/reopened events, update all properties
          if EVENT_ACTION in ("closed", "reopened"):
              page_id = find_page_by_issue_number(ISSUE_NUMBER)
              if not page_id:
                  print(f"No Notion page for issue #{ISSUE_NUMBER}; skipping status-only sync.")
                  exit(0)
              print(f"Updating existing page {page_id} for issue #{ISSUE_NUMBER}.")
              update_notion_page(page_id, completed, task_status, title=issue_title, labels=issue_labels, assignees=issue_assignees)
              exit(0)

          # For opened/edited: search for existing, create or update
          page_id = find_page_by_issue_number(ISSUE_NUMBER)

          if page_id:
              print(f"Updating existing page {page_id} for issue #{ISSUE_NUMBER}.")
              update_notion_page(page_id, completed, task_status, title=issue_title, labels=issue_labels, assignees=issue_assignees)
          else:
              print(f"Creating new Notion page for issue #{ISSUE_NUMBER}.")
              created = create_notion_page(
                  ISSUE_NUMBER, issue_title, completed, task_status,
                  labels=issue_labels, assignees=issue_assignees,
              )
              print(f"Created page {created.get('id', '?')}.")

          print(f"Notion sync complete for issue #{ISSUE_NUMBER}.")
          PY
