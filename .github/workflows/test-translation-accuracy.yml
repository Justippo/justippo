name: Translation Accuracy — Real Model Tests

# ── Gated translation accuracy testing with live m2m100 via Cloudflare Workers AI ──
# Manual trigger only to protect Cloudflare quota.
# Uses TRANSLATION_INTEGRATION_TESTS=true to gate the real-model test class.
# Requires CF_WORKERS_AI_API_TOKEN secret to be configured in GitHub.

on:
  workflow_dispatch:

env:
  TRANSLATION_TEST_DELAY_S: '0.5'

jobs:
  translation-accuracy:
    name: Translation Accuracy (Real Model)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run real-model translation accuracy tests
        env:
          CF_WORKERS_AI_API_TOKEN: ${{ secrets.CF_WORKERS_AI_API_TOKEN || '' }}
          TRANSLATION_INTEGRATION_TESTS: 'true'
        run: |
          if [ -z "$CF_WORKERS_AI_API_TOKEN" ]; then
            echo "⚠️ Skipping real-model tests: CF_WORKERS_AI_API_TOKEN not configured"
            echo "To enable: add CF_WORKERS_AI_API_TOKEN secret to GitHub repo settings"
            exit 0
          fi
          PYTEST_ADDOPTS='' uv run pytest -o addopts='' \
            tests/integration/test_translation_accuracy.py -k RealModel \
            -v --tb=short --cov=app --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-accuracy-report
          path: |
            backend/.pytest_cache/
            backend/coverage.xml

      - name: Report test results
        if: always()
        run: |
          echo "## Translation Accuracy Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Real-model tests completed (gated by TRANSLATION_INTEGRATION_TESTS=true)" >> $GITHUB_STEP_SUMMARY
          echo "📊 See artifacts for coverage.xml and test output" >> $GITHUB_STEP_SUMMARY
