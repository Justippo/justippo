name: Fix No Sprint Column (Manual)

on:
  workflow_dispatch:

concurrency:
  group: notion-fix-no-sprint
  cancel-in-progress: false

jobs:
  fix:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSL certificates
        run: |
          python3 -m pip install --quiet --break-system-packages certifi
          echo "SSL_CERT_FILE=$(python3 -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Fix pages with empty Sprint
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          sys.path.insert(0, "scripts")
          from notion_helpers import notion_request, notion_query_all, find_page_by_issue_number

          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]

          def gh_request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload else None
              headers = {
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  data=data, method=method, headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  print(f"GitHub {method} {path} failed HTTP {exc.code}: {raw[:300]}")
                  raise

          def sprint_from_labels(labels):
              label_set = {l.lower() for l in labels}
              if "sprint-1" in label_set:
                  return "Sprint 1"
              if "sprint-2" in label_set:
                  return "Sprint 2"
              if "sprint-3" in label_set:
                  return "Sprint 3"
              return "Product Backlog"

          # Fetch ALL Notion pages
          pages = notion_query_all()
          print(f"Found {len(pages)} Notion pages")

          # Find pages with empty Sprint
          fixed = 0
          for page in pages:
              page_id = page["id"]
              props = page.get("properties", {})
              sprint_prop = props.get("Sprint", {})
              sprint_val = sprint_prop.get("select")
              
              if sprint_val is None:
                  # Find the GitHub issue number
                  gh_prop = props.get("GitHub", {}).get("rich_text", [])
                  gh_text = "".join(t.get("plain_text", "") for t in gh_prop) if gh_prop else ""
                  
                  import re
                  issue_nums = re.findall(r"#(\d+)", gh_text)
                  
                  if issue_nums:
                      num = int(issue_nums[0])
                      try:
                          issue = gh_request("GET", f"/issues/{num}")
                          if "pull_request" in issue:
                              continue
                          labels = [l.get("name", "") for l in issue.get("labels", [])]
                          sprint = sprint_from_labels(labels)
                      except:
                          sprint = "Product Backlog"
                  else:
                      sprint = "Product Backlog"
                  
                  print(f"  Page {page_id} (#{gh_text}): → {sprint}")
                  notion_request("PATCH", f"/pages/{page_id}", {
                      "properties": {
                          "Sprint": {"select": {"name": sprint}}
                      }
                  })
                  fixed += 1
                  time.sleep(0.35)

          print(f"\nFixed {fixed} pages with empty Sprint")
          PY