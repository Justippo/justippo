server_name: "evidenceeu.eu.mihai.codes"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["::", "0.0.0.0"]
    resources:
      - names: [client, federation]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

media_store_path: /data/media_store
uploads_path: /data/uploads
signing_key_path: /data/evidenceeu.eu.mihai.codes.signing.key

enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: "evidence-eu-demo-2026"

rc_room_creation:
  per_second: 1000
  burst_count: 10000

rc_invites:
  per_room:
    per_second: 1000
    burst_count: 10000
  per_user:
    per_second: 1000
    burst_count: 10000
  per_issuer:
    per_second: 1000
    burst_count: 10000

rc_message:
  per_second: 1000
  burst_count: 10000

rc_login:
  address:
    per_second: 1000
    burst_count: 10000
  account:
    per_second: 1000
    burst_count: 10000

rc_3pid_validation:
  per_second: 1000
  burst_count: 10000

rc_registration:
  per_second: 1000
  burst_count: 10000

rc_joins:
  local:
    per_second: 1000
    burst_count: 10000
  remote:
    per_second: 1000
    burst_count: 10000

rc_joins_per_room:
  per_second: 1000
  burst_count: 10000

federation_domain_whitelist:
  - "*"

report_stats: false
