[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "evidence-eu-backend"
version = "0.1.0"
description = "Multilingual Document Intelligence for Cross-Border Europe — Backend"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "sse-starlette",
    "python-multipart",
    "python-jose",
    "passlib",
    "sqlmodel",
    "aiosqlite",
    "posthog>=3.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
core = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
rag = [
    "baml-py==0.222.0",
    "langchain-text-splitters>=0.2.0",
    "sentence-transformers>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0",
]
# ADR-009: Optional Reducto parsing for public EUR-Lex corpus only.
# EU data residency + ZDR require Growth/Enterprise plan (configured server-side).
# Standard tier (free, 15K credits) is sufficient for the ~55-doc public corpus.
# User-uploaded documents are NEVER routed through Reducto — in-house OCR only.
reducto = [
    "reductoai>=0.22.0",  # pip install reductoai (latest on PyPI is 0.x; >=1.0.0 was unresolvable)
    "aiofiles>=23.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "mistralai>=1.0.0",
    "pypdfium2>=4.30.0",  # ADR-006: pymupdf removed due to AGPL-3.0; pypdfium2 is Apache-2.0/BSD-licensed
    "pdf2image>=1.17.0",
]
translation = [
    "deep-translator>=1.11.4",
]
matrix = [
    "matrix-nio[e2e]>=0.24.0",
]
database = [
    "sqlmodel>=0.0.19",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
]
all = [
    "evidence-eu-backend[core,rag,ocr,translation,database,reducto]",
]
dev = [
    "evidence-eu-backend[all]",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-passlib",
    "types-python-jose",
    "fpdf2>=2.8.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
matrix = [
    "matrix-nio>=0.25.2",
]
rag = [
    "baml-py==0.222.0",
]
workers = [
    "workers-py",
]

[tool.uv]
# Ensure uv lock resolves wheels for both macOS (local dev) and Linux x86_64 (CI/production).
# Without this, a macOS-generated lock file can pin platform-specific wheels that have no
# Linux equivalents (e.g. greenlet 3.5.2 which ships only macosx/win wheels).
required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch"


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.worker"
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
# Suppress known-benign upstream warnings (no code-level fix available):
#  - StarletteDeprecationWarning: FastAPI TestClient wants httpx2 (packaging/version).
#  - ResourceWarning "unclosed database": SQLAlchemy sqlite engine GC'd on import
#    of app.main with the default DATABASE_URL (not a leak in our test code).
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
omit = ["app/worker.py"]
branch = true
relative_files = true
# Map the two import forms (app vs backend.app) to one source so coverage
# attributes execution regardless of which copy pytest's path resolution loads.
paths = { app = ["app", "backend/app"] }
