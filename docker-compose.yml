# Explicit project name: containers, networks and volumes are prefixed
# `justippo_` regardless of the checkout directory's name.
name: justippo

# Docker's default json-file driver never rotates, so one chatty container can
# fill the engine disk. Cap every service at 3 x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/repo/scripts:ro
      - ./docs:/docs:ro
      - ./backend/wrangler.toml:/repo/backend/wrangler.toml:ro
      - ./worker/wrangler.toml:/repo/worker/wrangler.toml:ro
      - ./.github/workflows/ci.yml:/repo/.github/workflows/ci.yml:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/repo:/app
      - REPO_ROOT=/repo
      - DATABASE_URL=sqlite+aiosqlite:///./evidence_eu.db
      - HINDSIGHT_API_URL=http://hindsight:8888
    depends_on:
      - chromadb
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
    command: npm run dev
    logging: *default-logging

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8500:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=none
    logging: *default-logging

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8600:8888"   # API  (host:8600 → container:8888)
      - "9999:9999"   # Control-plane UI
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    env_file:
      - ./.env
    environment:
      # LLM backend — used for recall/reflect queries only.
      # Ingestion uses RETAIN_EXTRACTION_MODE=chunks (zero LLM calls) to avoid
      # Groq free-tier rate limits (1K RPD / 100K TPD) during bulk corpus seeding.
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER:-groq}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-llama-3.3-70b-versatile}
      # chunks mode: store pre-split text as-is — no fact extraction LLM call per chunk.
      # Semantic search (embeddings + BM25 + graph) still works fully for recall.
      - HINDSIGHT_API_RETAIN_EXTRACTION_MODE=chunks
      # bge-small-en-v1.5 — fast 384-dim model (default Hindsight model).
      # English-only but works acceptably for DE/FR via CELEX regulation numbers in queries.
      # bge-m3 was tested but causes 600s+ reranking per query — unusable for eval.
      - HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL=BAAI/bge-small-en-v1.5
      # Stable worker identity so in-flight tasks survive restarts
      - HINDSIGHT_API_WORKER_ID=hindsight-evidence-eu
    restart: unless-stopped
    logging: *default-logging

  propella:
    image: lmsysorg/sglang:v0.5.13.post1-runtime
    ports:
      - "8700:8700"
    environment:
      - MODEL_PATH=ellamind/propella-1-0.6b
    command: >
      python -m sglang.launch_server
      --model-path ellamind/propella-1-0.6b
      --host 0.0.0.0
      --port 8700
      --context-length 65536
      --max-running-requests 256
      --chunked-prefill-size 8192
      --enable-mixed-chunk
      --num-continuous-decode-steps 8
      --grammar-backend llguidance
      --mem-fraction-static 0.7
    volumes:
      - propella_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  pii-redactor:
    build:
      context: ./sidecars/pii-redactor
      dockerfile: Dockerfile
    profiles:
      - pii-redaction
    ports:
      - "8760:8760"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8760/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

volumes:
  chromadb_data:
  hindsight_data:
  propella_model_cache:
